[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "continual-decision-model"
version = "0.1.0"
description = "Persistent context, continuing computation, and action under changing observations"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["numpy>=2.3.5,<3"]

[project.optional-dependencies]
neural = ["torch>=2.11,<2.15"]
multimodal = ["torch>=2.11,<2.15", "torchvision>=0.26", "transformers==5.4.0", "sentencepiece>=0.2,<0.3", "pillow>=10"]
discoveryworld = ["discoveryworld @ git+https://github.com/allenai/discoveryworld.git@fd591323920be0d3786ef350955de1945aa571e5"]
plots = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["cdm*"]
